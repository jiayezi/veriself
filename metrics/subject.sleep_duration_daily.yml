# subject.sleep_duration_daily —— 当日睡眠时长（第 0 层，直接来自观测通道）
metric_id: subject.sleep_duration_daily
version: 1
status: active
owner: qingping
display_name: 当日睡眠时长
synonyms: [睡眠时长, 睡了多久, sleep duration]
definition: 当日睡眠时长（小时），取当日 sleep_hours 通道观测之和；无观测的日期不产出数据行。
unit: hour
direction: higher_better
agg: mean
grain: day
entity: subject
allowed_dimensions: [date.weekday, date.day_of_week, date.month, date.quarter]
allowed_filters: [date.between, date.last_n_days, date.month]
rls_policy: owner_only
formula_sql: |
  fact_observation.sleep_hours
lineage:
  sources: [fact_observation.sleep_hours]
  upstream_metrics: []
