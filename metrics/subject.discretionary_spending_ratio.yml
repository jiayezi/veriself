# subject.discretionary_spending_ratio —— 非必要支出占比（第 0 层：事件视图的两个逻辑列相除）
# 非必要支出 = category ∈ {dining, entertainment, shopping} 的 transaction 金额（见 semantic_models/event.yml）。
# grain=month + bucket：物化器对日粒度比例自动做桶内均值（mean）并取桶内最后一个有数据的日期为 date_key。
metric_id: subject.discretionary_spending_ratio
version: 1
status: active
owner: qingping
display_name: 非必要支出占比
synonyms: [非必要支出, 冲动消费占比, discretionary ratio]
definition: 自然月内非必要支出（category 为 dining / entertainment / shopping 的 transaction 金额）占当月总支出的比例，按当月各日比例取均值；只在当月最后一个有数据的日期落一行。
unit: ratio
direction: lower_better
agg: mean
grain: month
entity: subject
allowed_dimensions: [date.weekday, date.day_of_week, date.month, date.quarter]
allowed_filters: [date.between, date.last_n_days, date.month]
rls_policy: no_pii
formula_sql: round(fact_event.discretionary_spending / nullif(fact_event.spending, 0), 4)
bucket:
  agg: mean
lineage:
  sources: [fact_event.discretionary_spending, fact_event.spending]
  upstream_metrics: []
