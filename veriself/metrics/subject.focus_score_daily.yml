# subject.focus_score_daily —— 专注度（第 0 层）
# version 2 口径：直接采用设备上报原始分并截断到 [0,100]。
# 历史版本 version 1（把 40-90 原始分线性拉伸到 0-100）见 metrics/history/。
metric_id: subject.focus_score_daily
version: 2
status: active
owner: jiayezi
display_name: 当日专注度
synonyms: [专注度, 专注得分, focus score]
definition: 当日专注度 0-100，直接采用设备上报的 focus_score 并截断到 [0,100]；受前夜睡眠驱动。当前口径 version 2 为原始分直取，version 1 曾把 40-90 的原始分线性拉伸到 0-100。
unit: score
direction: higher_better
agg: mean
grain: day
entity: subject
allowed_dimensions: [date.weekday, date.day_of_week, date.month, date.quarter]
allowed_filters: [date.between, date.last_n_days, date.month]
rls_policy: owner_only
formula_sql: |
  round(greatest(0, least(100, fact_observation.focus_score)), 2)
lineage:
  sources: [fact_observation.focus_score]
  upstream_metrics: []
