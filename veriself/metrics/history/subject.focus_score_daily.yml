# 历史版本：不参与 load_contracts()（查询/物化），由 load_definition_versions() 写入 dim_metric。
# metric_id 与 metrics/subject.focus_score_daily.yml 相同，version=1；口径差异：把 40-90 的原始分线性拉伸到 0-100（当前版本 version=2 为原始分直取并截断）。
metric_id: subject.focus_score_daily
version: 1
status: active
owner: jiayezi
display_name: 当日专注度
synonyms: [专注度, 专注得分, focus score]
definition: 当日专注度 0-100，把设备上报的 focus_score 从 40-90 区间线性拉伸到 0-100 后截断。这是 version 1 的历史归一化口径，已被原始分直取的 version 2 取代。
unit: score
direction: higher_better
agg: mean
grain: day
entity: subject
allowed_dimensions: [date.weekday, date.month, date.quarter]
allowed_filters: [date.between, date.last_n_days, date.month]
rls_policy: owner_only
formula_sql: |
  round(greatest(0, least(100, 100 * (fact_observation.focus_score - 40) / 50.0)), 2)
lineage:
  sources: [fact_observation.focus_score]
  upstream_metrics: []
