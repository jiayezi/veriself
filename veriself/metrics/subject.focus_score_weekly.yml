# subject.focus_score_weekly —— 周专注度（第 1 层：上游指标按自然周聚合）
# grain=week：SQL 按 ISO 周取均值，date_key 是该周最后一个有数据的日期。
metric_id: subject.focus_score_weekly
version: 1
status: active
owner: jiayezi
display_name: 周专注度
synonyms: [这周专注度, 周专注得分, weekly focus]
definition: 自然周（ISO 周，周一起算）内各日专注度的均值；只在该周最后一个有数据的日期落一行，date_key 为该日期。
unit: score
direction: higher_better
agg: mean
grain: week
entity: subject
allowed_dimensions: [date.weekday, date.day_of_week, date.month, date.quarter, context.is_travel, context.is_illness, context.location_type]
allowed_filters: [date.between, date.last_n_days, date.month, context.is_travel, context.is_illness, context.location_type]
rls_policy: aggregate_min5
depends_on: [subject.focus_score_daily]
