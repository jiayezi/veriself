# subject.sleep_regularity_7d —— 近 7 日作息规律度（第 1 层：上游指标 + 滚动标准差）
metric_id: subject.sleep_regularity_7d
version: 1
status: active
owner: jiayezi
display_name: 近7日作息规律度
synonyms: [作息规律, 睡眠规律性, sleep regularity]
definition: 近 7 日（含当日）睡眠时长的总体标准差映射到 0-100 的规律度；score = clamp(100 − 40 × σ, 0, 100)，σ 单位为小时。系数 40 按合成数据的 σ 分布标定（σ 中位数约 0.8h → 约 68 分，p99 约 1.6h → 约 37 分），σ 越小作息越规律、分越高。
unit: score
direction: higher_better
agg: mean
grain: day
entity: subject
allowed_dimensions: [date.weekday, date.day_of_week, date.month, date.quarter, context.is_travel, context.is_illness, context.location_type]
allowed_filters: [date.between, date.last_n_days, date.month, context.is_travel, context.is_illness, context.location_type]
rls_policy: aggregate_min5
formula_sql: |
  round(greatest(0, least(100, 100 - 40 * stddev_pop(metric('subject.sleep_duration_daily')) OVER (
      PARTITION BY subject_id
      ORDER BY date_key
      ROWS BETWEEN 6 PRECEDING AND CURRENT ROW
    ))), 2)
lineage:
  sources: []
  upstream_metrics: [subject.sleep_duration_daily]
